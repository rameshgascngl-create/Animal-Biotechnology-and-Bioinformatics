name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Extractor tests (Python)
        run: |
          pip install -r tools/requirements.txt pytest
          python3 -m pytest tools/tests -q
      - name: Extractor is reproducible (regenerated chapters equal committed)
        run: |
          for pair in I:1 II:2 III:3 IV:4 V:5; do python3 tools/extract/extract.py --unit ${pair%%:*} --out app/src/main/assets/content/u${pair##*:} --report /tmp/r.md --diagrams /tmp/d.json; done
          git diff --exit-code -- app/src/main/assets/content
      - name: Tier 1 setup (fonts and Python tools for the figure gate)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter libraqm0 libfribidi0
          pip install -r tools/diagrams/requirements.txt
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow has no Raqm: shaped-text measurement unavailable'; print('raqm ok')"
          test -f /usr/share/fonts/opentype/inter/Inter-Regular.otf
      - name: Tier 1 - figure geometry gate on every figure source (shaped text, EN and TA; regenerated SVG must equal the committed one)
        run: python3 tools/figures/gate_all.py --out /tmp/gate
      - name: Tier 1 - asset checks (sides <= 4096 px, decoded size, string tables complete, vector-term guard)
        run: python3 tools/ci/tier1_assets.py
      - name: Tier 1 - language scan (no Latin words added to Tamil strings, no Tamil in English)
        run: python3 tools/ci/language_scan.py
      - name: Tier 1 - interaction-word guard (no click/hover/mouse/panel wording in reader text)
        run: python3 tools/ci/guard_interaction_words.py
      - name: Unit tests (includes the JVM decode/scale tests and the 4096 px texture-limit test over every shipped figure)
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalBiotechnology-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the 'latest' release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AnimalBiotechnology.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest AnimalBiotechnology.apk --title "Latest APK" --notes "Debug-signed build of commit ${GITHUB_SHA::7}. Install on Android 8 or later." --target "$GITHUB_SHA"

      - name: Publish pilot APK as a pre-release (never the 'latest' release)
        if: github.ref == 'refs/heads/pilot/screening-d02'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AnimalBiotechnology-pilot.apk
          gh release delete pilot-screening-d02 --yes --cleanup-tag 2>/dev/null || true
          gh release create pilot-screening-d02 AnimalBiotechnology-pilot.apk --prerelease --title "Pilot build (screening-d02), not the latest app" --notes "Debug-signed CI build of pilot/screening-d02 commit ${GITHUB_SHA::7}. For the device checklist only." --target "$GITHUB_SHA"
      - name: Lint (report only)
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Release build with R8 (signed only if secrets exist)
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          ls -l app/build/outputs/apk/release app/build/outputs/bundle/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - name: Run summary (tiers)
        if: always()
        run: |
          { echo "## Tiers"; echo "- Tier 1 (this workflow, every push, no emulator): figure geometry gate, asset checks, language scan, interaction guard, extractor, unit tests incl. JVM decode/scale, APK build. Status: job conclusion above."
            echo "- Tier 2 (per batch, emulator, NEW figures only): runs in the 'Tier 2' workflow; it reports 'skipped' there when no redrawn figure changed."
            echo "- Tier 3 (full emulator suite): NOT run by this push. Runs nightly and before every RC (workflow 'Tier 3')."; } >> "$GITHUB_STEP_SUMMARY"
