name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalBiotechnology-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AnimalBiotechnology.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest AnimalBiotechnology.apk --title "Latest APK" --notes "Debug-signed build of commit ${GITHUB_SHA::7}. Install on Android 8 or later." --target "$GITHUB_SHA"
