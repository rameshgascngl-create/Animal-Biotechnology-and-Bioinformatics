name: Native reader emulator QA
on:
  push:
    branches: [feat/native-bilingual-reader]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM for CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p qa-captures
            adb shell wm size 720x1280
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.gasczoology.animalbiotech
            adb shell am start -W -n com.gasczoology.animalbiotech/.MainActivity | tee qa-captures/cold-start.txt
            stat -c '%s' app/build/outputs/apk/debug/app-debug.apk | tee qa-captures/apk-bytes.txt
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Pictures qa-captures/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reader-360dp-qa
          path: |
            qa-captures
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/apk/debug/app-debug.apk
