name: Native reader emulator QA
on:
  push:
    branches: [feat/native-bilingual-reader, fix/reader-markdown-tables-title, feat/book-ui, feat/book-reader, feat/figures-inline, bisect/viewer-only]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM for CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p qa-captures
            adb shell wm size 720x1280
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.gasczoology.animalbiotech
            adb shell am start -W -n com.gasczoology.animalbiotech/.MainActivity | tee qa-captures/cold-start.txt
            stat -c '%s' app/build/outputs/apk/debug/app-debug.apk | tee qa-captures/apk-bytes.txt
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Pictures qa-captures/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reader-360dp-qa
          path: |
            qa-captures
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/apk/debug/app-debug.apk
      - name: Publish screenshots to branch qa-captures (so they can be reviewed without downloading artifacts)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/qa && find qa-captures -name '*.png' -exec cp {} /tmp/qa/ \; || true
          cd /tmp/qa && echo "Screenshots from commit ${GITHUB_SHA}" > README.txt
          git init -q && git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "QA screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/qa-captures
