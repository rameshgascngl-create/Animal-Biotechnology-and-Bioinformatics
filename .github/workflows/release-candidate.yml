name: Release candidate
on:
  workflow_dispatch:
  push:
    branches: ['rc/**']
permissions:
  contents: write
env:
  RC_VERSION: 0.9.0-rc1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Python tests and language scan (Tamil resources must not contain stray Latin text; English must not contain Tamil)
        run: |
          pip install -r tools/requirements.txt pytest
          python3 -m pytest tools/tests -q
          python3 tools/ci/language_scan.py
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build R8 release APK (gate copy, debug-signed), debug APK and instrumentation APK
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Static gates (permissions, SDK levels, WebView, native libraries, size)
        run: |
          mkdir -p rc; APK=app/build/outputs/apk/release/app-release.apk
          cp $APK rc/gate.apk
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT2 dump permissions $APK | tee rc/permissions.txt
          $AAPT2 dump badging $APK | grep -E "^package|sdkVersion|targetSdkVersion|application-label:" | tee rc/badging.txt
          grep "uses-permission" rc/permissions.txt | grep -qv "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" && { echo "FATAL: the app declares permissions"; exit 1; } || echo "manifest permissions: none"
          grep -q "targetSdkVersion:'35'" rc/badging.txt || { echo "FATAL: targetSdk is not 35"; exit 1; }
          grep -q "sdkVersion:'26'" rc/badging.txt || { echo "FATAL: minSdk is not 26"; exit 1; }
          mkdir -p /tmp/dex && cd /tmp/dex && unzip -qo "$GITHUB_WORKSPACE/$APK" 'classes*.dex' && cd -
          n=$(cat /tmp/dex/classes*.dex | strings | grep -c "android/webkit/WebView" || true)
          echo "WebView references in R8 dex: $n" | tee rc/webview.txt
          [ "$n" = "0" ] || { echo "FATAL: WebView referenced in the release build"; exit 1; }
          unzip -l $APK | grep -E " lib/" | tee rc/native-libs.txt || echo "no native libraries (lib/ absent): per-ABI APKs would be identical to the universal APK" | tee rc/native-libs.txt
          { echo "universal APK bytes: $(stat -c %s $APK)"; echo "debug APK bytes: $(stat -c %s app/build/outputs/apk/debug/app-debug.apk)"; unzip -lv $APK | sort -k1 -n -r | head -15; } | tee rc/size.txt
      - name: Final APK (release key if the secrets exist, otherwise the debug-signed copy labelled NOT for distribution)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "rc/AnimalBiotechnology-$RC_VERSION.apk"; echo signed > rc/signing.txt
          else
            cp rc/gate.apk "rc/AnimalBiotechnology-$RC_VERSION-NOT-FOR-DISTRIBUTION-debug-signed.apk"; echo debug-signed > rc/signing.txt
          fi
          cat rc/signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rc-build
          path: rc
      - uses: actions/upload-artifact@v4
        with:
          name: rc-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, limit: 8000, label: minSdk-api26 }
          - { api: 35, limit: 4000, label: api35 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - uses: actions/download-artifact@v4
        with: { name: rc-build, path: rc }
      - name: Previous build (the 'latest' release asset) for the upgrade gate
        env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir -p prev && gh release download latest -p AnimalBiotechnology.apk -D prev && ls -l prev
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: bash tools/ci/rc_emulator.sh rc/gate.apk prev/AnimalBiotechnology.apk ${{ matrix.limit }} ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-emulator-${{ matrix.label }}
          path: qa-captures
  release:
    needs: [build, emulator]
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'rc/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rc-build, path: rc }
      - name: Publish pre-release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          APK=$(ls rc/AnimalBiotechnology-*.apk); S=$(cat rc/signing.txt)
          { cat docs/RELEASE_NOTES_RC.md; echo; echo "Signing: $S. Universal APK bytes: $(stat -c %s $APK). Commit ${GITHUB_SHA::7}."; } > notes.md
          [ "$S" = "debug-signed" ] && echo "**NOT for distribution: debug-signed. Sideload for testing only.**" | cat - notes.md > n2.md && mv n2.md notes.md
          gh release delete "v$RC_VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$RC_VERSION" "$APK" --prerelease --title "v$RC_VERSION (release candidate)" --notes-file notes.md --target "$GITHUB_SHA"
