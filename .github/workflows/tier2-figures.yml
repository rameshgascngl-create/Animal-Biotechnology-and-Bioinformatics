name: Tier 2 - new-figure captures (per batch)
# Emulator captures of ONLY the figures that are new in this push (redrawn figures whose PNG changed since the previous push), or the ids given by hand.
# Three sizes run as parallel jobs on a cached AVD snapshot. Earlier batches are never re-run. When no figure changed, the run says so in its summary.
on:
  push:
    branches: ['phase2/**', 'rc/**']
  workflow_dispatch:
    inputs:
      figures: { description: 'Comma-separated figure ids (overrides the changed-asset detection)', required: false, default: '' }
      base: { description: 'Compare against this commit instead of the previous push', required: false, default: '' }
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.pick.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        env:
          IN_FIGURES: ${{ inputs.figures }}
          IN_BASE: ${{ inputs.base }}
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$IN_BASE"; [ -n "$BASE" ] || BASE="$BEFORE"
          IDS=$(python3 tools/ci/new_figures.py --base "$BASE" --figures "$IN_FIGURES")
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          { echo "## Tier 2 (per-batch new-figure captures)"
            if [ -z "$IDS" ]; then echo "- **SKIPPED**: no redrawn figure changed in this push, so there is nothing new to capture."; else echo "- new figures ($(echo $IDS | tr ',' '\n' | wc -l)): \`$IDS\`"; fi
            echo "- Tier 1 ran in the 'Build APK' workflow; Tier 3 (full suite) is NOT run here: nightly and before every RC."; } >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: detect
    if: needs.detect.outputs.ids != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - run: |
          mkdir -p apks; cp app/build/outputs/apk/debug/app-debug.apk apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with: { name: tier2-apks, path: apks }
  avd:
    needs: detect
    if: needs.detect.outputs.ids != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-pixel_2-v1
      - name: Create the AVD and its snapshot (only on a cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
  capture:
    needs: [detect, build, avd]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 360x800, size: 1080x2400, density: 480 }
          - { label: 411x914, size: 1080x2400, density: 420 }
          - { label: 360x640, size: 720x1280, density: 320 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tier2-apks, path: . }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-pixel_2-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash tools/ci/tier2_capture.sh "${{ needs.detect.outputs.ids }}" ${{ matrix.size }} ${{ matrix.density }} ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-captures-${{ matrix.label }}
          path: qa-captures
  publish:
    needs: [detect, capture]
    if: always() && needs.detect.outputs.ids != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'tier2-captures-*', path: caps, merge-multiple: true }
      - name: Contact sheets (360x800, EN above TA, 12 per sheet) and the qa-runs branch
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          pip install -q Pillow
          mkdir -p /tmp/qa
          find caps \( -name '*.png' -o -name '*.txt' \) -exec cp {} /tmp/qa/ \;
          python3 tools/ci/contact_sheet.py caps 360x800 /tmp/qa/sheet "${{ needs.detect.outputs.ids }}" || echo "contact sheet not built (a capture is missing; see the capture jobs)"
          cd /tmp/qa && echo "Tier 2 captures for ${GITHUB_SHA}: ${{ needs.detect.outputs.ids }}" > README.txt
          git init -q && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m "Tier 2 captures for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/qa-runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          { echo "- captures and sheets: branch \`qa-runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"; } >> "$GITHUB_STEP_SUMMARY"
