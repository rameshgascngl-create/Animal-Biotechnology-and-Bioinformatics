name: Tier 3 - full emulator suite (nightly, before every RC)
# Tier 1 (every push, no emulator): Build APK workflow.   Tier 2 (per batch, new figures only): Tier 2 workflow.   Tier 3 (this file): everything on an emulator.
on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Enable KVM for CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Record the hash of the regression test file
        run: |
          mkdir -p qa-captures
          sha256sum app/src/androidTest/java/com/gasczoology/animalbiotech/ViewerRegressionTest.kt | tee qa-captures/test-sha256.txt
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" | tee qa-captures/run-id.txt
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          ram-size: 2048M
          script: bash tools/ci/emulator-suite.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier3-qa
          path: |
            qa-captures
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/apk/debug/app-debug.apk
      - name: Run summary
        if: always()
        run: |
          { echo "## Tier 3 (full emulator suite)"; echo "- ran: base androidTest suite (all classes except Tier 2 per-figure capture), viewer lifecycle + memory budget on the representative figures: $(cat qa-captures/representatives.txt 2>/dev/null)";
            echo "- not run here: Tier 1 (Build APK workflow, every push) and Tier 2 (per-batch new-figure captures)";
            echo "- install/upgrade/offline/cold-start gates: release-candidate workflow (same Tier 3 plus those gates run before every RC)";
            [ -s qa-captures/failures.txt ] && { echo "### FAILED"; sed 's/^/- /' qa-captures/failures.txt; } || echo "- failures: none"; } >> "$GITHUB_STEP_SUMMARY"
